# Production / test deployment stack.
#
# Images are built once by GitHub Actions and pushed to GitHub Container
# Registry (ghcr.io), tagged with the git commit SHA. Servers only pull and
# restart — nothing is built on the server. See scripts/deploy/deploy.sh.
#
#   IMAGE_REGISTRY  ghcr.io/kubernitimoney-tech   (default)
#   IMAGE_TAG       git commit SHA to run          (set by deploy.sh)
#   STACK           test | prod                    (picks frontend/marketing build + network aliases)
#
# Only Caddy is exposed to the internet (ports 80/443). Everything else talks
# over the internal Docker network. Exactly one stack per server runs Caddy
# (--profile edge). Web containers join the shared external network
# "knm-edge" as <STACK>-django / -frontend / -marketing. Create it once:
#   docker network create knm-edge
#
# Emergency fallback (registry unavailable): build on the server with
#   STACK=prod IMAGE_TAG=local docker compose -p knm-crm -f docker-compose.prod.yml build
# then run scripts/deploy/deploy.sh with IMAGE_TAG=local SKIP_PULL=1.

x-backend-image: &backend-image ${IMAGE_REGISTRY:-ghcr.io/kubernitimoney-tech}/knm-crm-backend:${IMAGE_TAG:-latest}

services:
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - django
      - frontend
      - marketing

  django:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: *backend-image
    restart: unless-stopped
    # Migrations run as a separate step in deploy.sh before this restarts, and
    # static files are baked into the image, so gunicorn starts in seconds.
    # Only files not yet owned by appuser are fixed (fast on large media).
    command: >
      sh -c "mkdir -p /app/media/documents &&
             find /app/media ! -user appuser -exec chown appuser:appuser {} + 2>/dev/null || true;
             exec gosu appuser gunicorn config.wsgi:application --config docker/gunicorn.conf.py"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Forwarded-Proto: https", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - media_data:/app/media
    env_file:
      - ./backend/.env
    environment:
      GUNICORN_WORKERS: "3"
      GUNICORN_THREADS: "2"
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@postgres:5432/${POSTGRES_DB:-lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TZ: Asia/Kolkata
    networks:
      default: {}
      edge:
        aliases:
          - ${STACK:-prod}-django
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-test.kubernitimoney.com/api/v1}
    image: ${IMAGE_REGISTRY:-ghcr.io/kubernitimoney-tech}/knm-crm-frontend-${STACK:-prod}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      default: {}
      edge:
        aliases:
          - ${STACK:-prod}-frontend
    depends_on:
      - django

  marketing:
    build:
      context: ./marketing-site
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-test.kubernitimoney.com/api/v1}
        VITE_BRAND_NAME: Kuberniti Money
        VITE_SUPPORT_EMAIL: support@kubernitimoney.com
        VITE_SUPPORT_PHONE: "+91-1800-XXX-XXXX"
        VITE_WHATSAPP_NUMBER: "919999999999"
        VITE_SITE_URL: ${VITE_SITE_URL:-https://dev.kubernitimoney.com}
    image: ${IMAGE_REGISTRY:-ghcr.io/kubernitimoney-tech}/knm-crm-marketing-${STACK:-prod}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      default: {}
      edge:
        aliases:
          - ${STACK:-prod}-marketing
    depends_on:
      - django

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    image: *backend-image
    restart: unless-stopped
    # Let running tasks (emails, reports) finish before a restart.
    stop_grace_period: 60s
    command: celery -A config worker -l info -Q default,notifications,reports
    volumes:
      - media_data:/app/media
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@postgres:5432/${POSTGRES_DB:-lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TZ: Asia/Kolkata
    depends_on:
      - django
      - redis

  celery-beat:
    image: *backend-image
    restart: unless-stopped
    stop_grace_period: 30s
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@postgres:5432/${POSTGRES_DB:-lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TZ: Asia/Kolkata
    depends_on:
      - django
      - redis

networks:
  default: {}
  edge:
    name: ${EDGE_NETWORK:-knm-edge}
    external: true

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
