# Production / testing / staging deployment stack.
# Set VITE_API_URL and VITE_SITE_URL per environment (see GitHub Actions).
#
# One-time setup on the server:
#   cp backend/.env.production.example backend/.env   # then edit secrets
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec django python manage.py createsuperuser
#
# Only Caddy is exposed to the internet (ports 80/443). Everything else talks
# over the internal Docker network.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media_data:/srv/media:ro
    depends_on:
      - django
      - frontend
      - marketing

  django:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: lms-backend:latest
    restart: unless-stopped
    command: >
      sh -c "mkdir -p /app/media/documents &&
             chown -R appuser:appuser /app/media 2>/dev/null || true &&
             exec gosu appuser sh -c 'python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 120'"
    volumes:
      - media_data:/app/media
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@postgres:5432/${POSTGRES_DB:-lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-test.kubernitimoney.com/api/v1}
    image: lms-frontend:latest
    restart: unless-stopped
    depends_on:
      - django

  marketing:
    build:
      context: ./marketing-site
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-test.kubernitimoney.com/api/v1}
        VITE_BRAND_NAME: Kuberniti Money
        VITE_SUPPORT_EMAIL: support@kubernitimoney.com
        VITE_SUPPORT_PHONE: "+91-1800-XXX-XXXX"
        VITE_WHATSAPP_NUMBER: "919999999999"
        VITE_SITE_URL: ${VITE_SITE_URL:-https://dev.kubernitimoney.com}
    image: lms-marketing:latest
    restart: unless-stopped
    depends_on:
      - django

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    image: lms-backend:latest
    restart: unless-stopped
    command: celery -A config worker -l info -Q default,notifications,reports
    volumes:
      - media_data:/app/media
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@postgres:5432/${POSTGRES_DB:-lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TZ: Asia/Kolkata
    depends_on:
      - django
      - redis

  celery-beat:
    image: lms-backend:latest
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@postgres:5432/${POSTGRES_DB:-lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TZ: Asia/Kolkata
    depends_on:
      - django
      - redis

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
