# Run the full stack from the repo root:
#   cp backend/.env.example backend/.env
#   docker compose up -d --build
#   docker compose exec django python manage.py seed_sample_data

services:
  django:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    command:
      - sh
      - -c
      - mkdir -p /app/media/documents && chown -R appuser:appuser /app/media 2>/dev/null || true && exec gosu appuser sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --config docker/gunicorn.conf.py --reload'
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@postgres:5432/${POSTGRES_DB:-lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_SETTINGS_MODULE: config.settings.local
      TIME_ZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 10s
      timeout: 10s
      retries: 5
      # migrate + collectstatic run before gunicorn binds the port.
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      django:
        condition: service_healthy

  marketing-site:
    build:
      context: ./marketing-site
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev"
    ports:
      - "3001:3001"
    volumes:
      - ./marketing-site:/app
      - marketing_site_node_modules:/app/node_modules
    env_file:
      - ./marketing-site/.env
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_BRAND_NAME: Kuberniti Money
      VITE_SUPPORT_EMAIL: support@kubernitimoney.com
      VITE_SUPPORT_PHONE: +91-1800-XXX-XXXX
      VITE_WHATSAPP_NUMBER: "919999999999"
      VITE_SITE_URL: http://localhost:3001
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      django:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
    # Postgres is internal-only; use Adminer on :8080 or psql via exec.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Internal only; other services connect at redis:6379.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    command: celery -A config worker -l info -Q default,notifications,reports
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@postgres:5432/${POSTGRES_DB:-lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_SETTINGS_MODULE: config.settings.local
      TIME_ZONE: Asia/Kolkata
      TZ: Asia/Kolkata
    depends_on:
      - django
      - redis

  celery-beat:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@postgres:5432/${POSTGRES_DB:-lms}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_SETTINGS_MODULE: config.settings.local
      TIME_ZONE: Asia/Kolkata
      TZ: Asia/Kolkata
    depends_on:
      - django
      - redis

volumes:
  postgres_data:
  media_data:
  frontend_node_modules:
  marketing_site_node_modules:
