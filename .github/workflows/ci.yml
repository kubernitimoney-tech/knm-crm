name: CI/CD

on:
  push:
    branches: [development, testing, staging, production, main, master]
  pull_request:
    branches: [development, testing, staging, production, main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend — Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install Ruff
        run: pip install "ruff>=0.9,<1.0"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format (check)
        run: ruff format --check .

  backend-test:
    name: Backend — Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/test.txt

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Run tests
        run: pytest -q --tb=short
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  frontend-lint:
    name: Frontend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:eslint

      # Full type-check: npm run lint:types (run locally; enable in CI when TS debt is cleared)

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1

  marketing-site-lint:
    name: Marketing site — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing-site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: marketing-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:eslint

      # Full type-check: npm run lint:types (run locally; enable in CI when TS debt is cleared)

  marketing-site-build:
    name: Marketing site — Build
    runs-on: ubuntu-latest
    needs: marketing-site-lint
    defaults:
      run:
        working-directory: marketing-site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: marketing-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1

  # ---------------------------------------------------------------------------
  # CD — deploy the `testing` branch to the test VPS (test.kubernitimoney.com).
  # Runs only on a push to `testing` (i.e. after a PR is merged), and only once
  # every check above has passed.
  # ---------------------------------------------------------------------------
  deploy-test:
    name: Deploy — Test (test.kubernitimoney.com)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing'
    needs:
      - backend-lint
      - backend-test
      - frontend-build
      - marketing-site-build
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
            cd ~/lms
            git fetch origin testing
            git checkout testing
            git reset --hard origin/testing
            # Build once per app (backend image shared by django/celery/celery-beat).
            docker compose -f docker-compose.prod.yml build --parallel django frontend marketing
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
