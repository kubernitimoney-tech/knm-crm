name: CI/CD

# Promotion path (PRs, not auto-merge):
#   development → testing → production
#
#   PR (any branch)      → checks only
#   push to development  → checks, open development → testing PR
#   push to testing      → checks, build images once (tag = commit SHA),
#                          deploy them to the test VPS, open testing → production PR
#   push to production   → checks only (no deploy)
#   Run workflow (manual, on production, type DEPLOY)
#                        → deploy the same tested images to production
#
# Servers never build: they pull images, back up the DB, migrate, restart,
# health-check and roll back automatically on failure (scripts/deploy/deploy.sh).

on:
  push:
    branches: [development, testing, production, main, master]
  pull_request:
    branches: [development, testing, production, main, master]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to deploy production (run on the production branch)"
        required: true
        default: ""
      image_tag:
        description: "Optional commit SHA to deploy (e.g. to roll back). Empty = newest tested build in production."
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only superseded PR runs are cancelled; a running deploy is never interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  GIT_REPO: https://github.com/kubernitimoney-tech/knm-crm.git

jobs:
  backend-lint:
    name: Backend — Ruff
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install Ruff
        run: pip install "ruff==0.15.20"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format (check)
        run: ruff format --check .

  backend-test:
    name: Backend — Pytest
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/test.txt

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Run tests
        run: pytest -q --tb=short
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  frontend-lint:
    name: Frontend — Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:eslint

      # Full type-check: npm run lint:types (run locally; enable in CI when TS debt is cleared)

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1

  marketing-site-lint:
    name: Marketing site — Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    defaults:
      run:
        working-directory: marketing-site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: marketing-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:eslint

      # Full type-check: npm run lint:types (run locally; enable in CI when TS debt is cleared)

  marketing-site-build:
    name: Marketing site — Build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    needs: marketing-site-lint
    defaults:
      run:
        working-directory: marketing-site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: marketing-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1

  # ---------------------------------------------------------------------------
  # Promote: open (or reuse) a PR to the next branch. This job does not merge.
  # ---------------------------------------------------------------------------
  promote-development-to-testing:
    name: Promote — development → testing
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - backend-lint
      - backend-test
      - frontend-build
      - marketing-site-build
    steps:
      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base testing \
            --head development \
            --title "Promote development → testing" \
            --body "CI passed on \`development\`. Review and merge to deploy the test VPS." \
            || echo "Promotion PR already open."

  # ---------------------------------------------------------------------------
  # Build images ONCE (push to testing). Tagged with the commit SHA and pushed
  # to GitHub Container Registry. Test and production run these same images;
  # only the frontend/marketing builds differ (API URL is baked in at build).
  # ---------------------------------------------------------------------------
  build-images:
    name: Build images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing'
    needs:
      - backend-lint
      - backend-test
      - frontend-build
      - marketing-site-build
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      SOURCE_LABEL: org.opencontainers.image.source=https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend (django, celery, celery-beat)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/knm-crm-backend:${{ github.sha }}
          labels: ${{ env.SOURCE_LABEL }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend (test)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/knm-crm-frontend-test:${{ github.sha }}
          labels: ${{ env.SOURCE_LABEL }}
          build-args: |
            VITE_API_URL=https://api-test.kubernitimoney.com/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Frontend (prod)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/knm-crm-frontend-prod:${{ github.sha }}
          labels: ${{ env.SOURCE_LABEL }}
          build-args: |
            VITE_API_URL=https://api.kubernitimoney.com/api/v1
          cache-from: type=gha,scope=frontend

      - name: Marketing site (test)
        uses: docker/build-push-action@v6
        with:
          context: marketing-site
          file: marketing-site/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/knm-crm-marketing-test:${{ github.sha }}
          labels: ${{ env.SOURCE_LABEL }}
          build-args: |
            VITE_API_URL=https://api-test.kubernitimoney.com/api/v1
            VITE_SITE_URL=https://dev.kubernitimoney.com
            VITE_BRAND_NAME=Kuberniti Money
            VITE_SUPPORT_EMAIL=support@kubernitimoney.com
            VITE_SUPPORT_PHONE=+91-1800-XXX-XXXX
            VITE_WHATSAPP_NUMBER=919999999999
          cache-from: type=gha,scope=marketing
          cache-to: type=gha,mode=max,scope=marketing

      - name: Marketing site (prod)
        uses: docker/build-push-action@v6
        with:
          context: marketing-site
          file: marketing-site/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/knm-crm-marketing-prod:${{ github.sha }}
          labels: ${{ env.SOURCE_LABEL }}
          build-args: |
            VITE_API_URL=https://api.kubernitimoney.com/api/v1
            VITE_SITE_URL=https://kubernitimoney.com
            VITE_BRAND_NAME=Kuberniti Money
            VITE_SUPPORT_EMAIL=support@kubernitimoney.com
            VITE_SUPPORT_PHONE=+91-1800-XXX-XXXX
            VITE_WHATSAPP_NUMBER=919999999999
          cache-from: type=gha,scope=marketing

      - name: Summary
        run: |
          echo "### Images built for \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this tag to deploy production: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Deploy testing → test VPS (automatic after images are built).
  # The server only pulls images and restarts; nothing is built there.
  # Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT
  # ---------------------------------------------------------------------------
  deploy-test:
    name: Deploy — Test (test.kubernitimoney.com)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing'
    needs: build-images
    permissions:
      contents: read
      packages: read
      pull-requests: write
    concurrency:
      group: vps-testing
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            REPO_URL=https://github.com/kubernitimoney-tech/knm-crm.git
            DEPLOY_DIR=/knm-crm
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone --branch testing "$REPO_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin testing
            git checkout testing
            git reset --hard "$IMAGE_TAG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            STACK=test IMAGE_TAG="$IMAGE_TAG" bash scripts/deploy/deploy.sh

      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base production \
            --head testing \
            --title "Promote testing → production" \
            --body "Test VPS deploy succeeded with images \`${{ github.sha }}\`. Merge, then run **Actions → CI/CD → Run workflow** on \`production\` to deploy." \
            || echo "Promotion PR already open."

  # ---------------------------------------------------------------------------
  # Deploy production — MANUAL ONLY.
  # Actions → CI/CD → Run workflow → branch: production → type DEPLOY.
  # Deploys the newest tested images already merged into `production`
  # (or the image_tag you enter, e.g. to roll back). Nothing is built here.
  # Secrets: PROD_VPS_HOST, PROD_VPS_USER, PROD_VPS_SSH_KEY, PROD_VPS_PORT
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy — Production (app.kubernitimoney.com)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production'
    permissions:
      contents: read
      packages: read
    concurrency:
      group: vps-production
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "::error::Type DEPLOY in the confirm box to deploy production."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 200

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick images
        id: pick
        env:
          REQUESTED: ${{ inputs.image_tag }}
        run: |
          set -e
          has_images() {
            docker manifest inspect "$REGISTRY/knm-crm-backend:$1" >/dev/null 2>&1 &&
            docker manifest inspect "$REGISTRY/knm-crm-frontend-prod:$1" >/dev/null 2>&1 &&
            docker manifest inspect "$REGISTRY/knm-crm-marketing-prod:$1" >/dev/null 2>&1
          }
          if [ -n "$REQUESTED" ]; then
            TAG="$(git rev-parse --verify "${REQUESTED}^{commit}")"
            # Only code that has been merged into production may go live.
            if ! git merge-base --is-ancestor "$TAG" HEAD; then
              echo "::error::$REQUESTED is not part of the production branch."
              exit 1
            fi
            has_images "$TAG" || { echo "::error::No images built for $TAG."; exit 1; }
          else
            TAG=""
            for sha in $(git rev-list -n 200 HEAD); do
              if has_images "$sha"; then TAG="$sha"; break; fi
            done
            [ -n "$TAG" ] || { echo "::error::No tested images found in production history."; exit 1; }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Deploying \`$TAG\` to production" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%h %s (%an, %ad)' "$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.pick.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          port: ${{ secrets.PROD_VPS_PORT }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            REPO_URL=https://github.com/kubernitimoney-tech/knm-crm.git
            DEPLOY_DIR=/knm-crm
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone --branch production "$REPO_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin production
            git checkout production
            # Config files (compose, Caddyfile, deploy script) from the same commit as the images.
            git reset --hard "$IMAGE_TAG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            STACK=prod IMAGE_TAG="$IMAGE_TAG" bash scripts/deploy/deploy.sh
